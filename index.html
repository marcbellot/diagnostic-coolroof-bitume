<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ORICAMI — Diagnostic Confort d'Été</title>
<style>
  :root{
    --rouge: #BA151B;
    --rouge-dark: #8f1015;
    --gris: #4C5962;
    --bleu: #1F2A38;
    --bleu-light: #2c3b4e;
    --bg: #F3F4F5;
    --card: #FFFFFF;
    --text: #1F2A38;
    --text-muted: #667079;
    --border: #E2E5E8;
    --ok-bg: #FBEAEA;
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .app{
    width:100%;
    max-width:720px;
    min-height:100vh;
    background: var(--card);
    display:flex;
    flex-direction:column;
    box-shadow: 0 0 40px rgba(0,0,0,0.06);
  }
  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:3px solid var(--rouge);
    background: var(--bleu);
  }
  header.topbar img{
    height:34px;
    display:block;
    background:#fff;
    padding:4px 8px;
    border-radius:6px;
  }
  header.topbar .tag{
    color:#fff;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    opacity:.85;
    text-align:right;
    line-height:1.3;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:28px 22px 40px;
  }
  /* progress bar */
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:26px;
  }
  .progress-label{
    font-size:12px;
    color:var(--text-muted);
    white-space:nowrap;
    font-weight:600;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:#E9EBED;
    border-radius:6px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--rouge);
    border-radius:6px;
    transition: width .35s ease;
  }
  .nav-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--gris);
    font-size:13px;
    cursor:pointer;
    padding:6px 4px;
    text-decoration:underline;
  }
  .link-btn:hover{ color: var(--rouge); }

  /* start screen */
  .start-title{
    font-size:26px;
    font-weight:800;
    color:var(--bleu);
    margin: 4px 0 6px;
  }
  .start-sub{
    color:var(--text-muted);
    font-size:15px;
    margin-bottom:26px;
    line-height:1.5;
  }
  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--gris);
    margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    padding:12px 14px;
    border:2px solid var(--border);
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    color:var(--text);
    background:#fff;
  }
  .field input:focus, .field select:focus{
    outline:none;
    border-color:var(--rouge);
  }
  .note-box{
    background:#F7F8F9;
    border-left:4px solid var(--gris);
    border-radius:8px;
    padding:14px 16px;
    font-size:13px;
    color:var(--text-muted);
    line-height:1.5;
    margin-bottom:22px;
  }

  /* question screen */
  .q-eyebrow{
    font-size:12px;
    font-weight:700;
    color:var(--rouge);
    text-transform:uppercase;
    letter-spacing:.05em;
    margin-bottom:10px;
  }
  .q-text{
    font-size:22px;
    font-weight:700;
    color:var(--bleu);
    line-height:1.35;
    margin-bottom:14px;
  }
  .q-aide{
    font-size:14px;
    color:var(--text-muted);
    line-height:1.5;
    margin-bottom:30px;
    padding-left:14px;
    border-left:3px solid var(--border);
  }
  .btn-stack{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:auto;
  }
  .btn-big{
    width:100%;
    padding:22px 20px;
    font-size:20px;
    font-weight:800;
    border-radius:14px;
    border:none;
    cursor:pointer;
    letter-spacing:.02em;
    transition: transform .08s ease, filter .15s ease;
  }
  .btn-big:active{ transform: scale(0.98); }
  .btn-oui{ background: var(--rouge); color:#fff; }
  .btn-oui:hover{ filter:brightness(1.08); }
  .btn-non{ background: var(--bleu); color:#fff; }
  .btn-non:hover{ filter:brightness(1.15); }
  .btn-incertain{
    background:transparent;
    color: var(--gris);
    border:2px solid var(--border);
    font-size:14px;
    font-weight:700;
    padding:12px 20px;
    border-radius:10px;
  }
  .btn-incertain:hover{ border-color:var(--gris); }

  /* recommendation reveal screen */
  .reveal-badge{
    display:inline-block;
    background: var(--ok-bg);
    color: var(--rouge);
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.05em;
    padding:6px 12px;
    border-radius:20px;
    margin-bottom:16px;
  }
  .reveal-title{
    font-size:28px;
    font-weight:900;
    color:var(--bleu);
    line-height:1.25;
    margin-bottom:6px;
  }
  .reveal-fiche{
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:20px;
    font-weight:600;
  }
  .reveal-section{
    margin-bottom:18px;
  }
  .reveal-section h4{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--gris);
    margin:0 0 6px;
    font-weight:800;
  }
  .reveal-section p, .reveal-section li{
    font-size:15px;
    line-height:1.55;
    color:var(--text);
    margin:0 0 4px;
  }
  .reveal-section ul{ margin:0; padding-left:20px; }
  .warn-box{
    background:#FFF6E5;
    border-left:4px solid #C98A0A;
    border-radius:8px;
    padding:12px 14px;
    font-size:13.5px;
    color:#6b4c04;
    line-height:1.5;
    margin-bottom:18px;
  }
  .unsure-box{
    background:#F1F3F5;
    border-left:4px solid var(--gris);
    border-radius:8px;
    padding:12px 14px;
    font-size:13.5px;
    color:var(--gris);
    line-height:1.5;
    margin-bottom:18px;
  }
  .btn-continue{
    margin-top:auto;
    width:100%;
    padding:18px 20px;
    font-size:17px;
    font-weight:800;
    border-radius:14px;
    border:none;
    background:var(--bleu);
    color:#fff;
    cursor:pointer;
  }
  .btn-continue:hover{ filter:brightness(1.15); }

  /* final synthesis */
  .final-header{
    background: var(--bleu);
    color:#fff;
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:24px;
  }
  .final-header .ftitle{ font-size:20px; font-weight:800; margin-bottom:4px;}
  .final-header .fmeta{ font-size:13px; opacity:.85; }
  .rec-card{
    border:2px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
  }
  .rec-card.priority{ border-color: var(--rouge); background: #FFFBFB; }
  .rec-tag{
    display:inline-block;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .rec-tag.priority{ background:var(--rouge); color:#fff; }
  .rec-tag.comp{ background:#E9EBED; color:var(--gris); }
  .rec-card h3{ font-size:18px; color:var(--bleu); margin:0 0 8px; font-weight:800;}
  .rec-card p{ font-size:14.5px; line-height:1.55; margin:0 0 8px; }
  .rec-card .fiche{ font-size:12px; color:var(--text-muted); font-weight:600; }
  .section-title{
    font-size:14px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--gris);
    margin: 26px 0 12px;
    padding-bottom:8px;
    border-bottom:2px solid var(--border);
  }
  .ecarte-item{
    font-size:14px;
    color:var(--text-muted);
    line-height:1.5;
    margin-bottom:8px;
    padding-left:14px;
    border-left:3px solid var(--border);
  }
  .mesure-list{ list-style:none; padding:0; margin:0; }
  .mesure-list li{
    font-size:14px;
    line-height:1.5;
    padding:8px 0;
    border-bottom:1px solid var(--border);
    display:flex;
    gap:10px;
  }
  .mesure-list li:last-child{ border-bottom:none; }
  .mesure-list .chk{
    flex-shrink:0;
    width:18px; height:18px;
    border:2px solid var(--gris);
    border-radius:4px;
    margin-top:2px;
  }
  .footer-note{
    margin-top:24px;
    font-size:12.5px;
    color:var(--text-muted);
    line-height:1.6;
    background:#F7F8F9;
    border-radius:10px;
    padding:14px 16px;
  }
  .final-actions{
    display:flex;
    gap:12px;
    margin-top:26px;
  }
  .btn-secondary, .btn-primary{
    flex:1;
    padding:16px;
    border-radius:12px;
    font-size:15px;
    font-weight:800;
    border:none;
    cursor:pointer;
  }
  .btn-primary{ background:var(--rouge); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-secondary{ background:#fff; color:var(--gris); border:2px solid var(--border); }
  .btn-secondary:hover{ border-color:var(--gris); }

  @media (max-width:480px){
    .q-text{ font-size:19px; }
    .reveal-title{ font-size:23px; }
    .btn-big{ font-size:18px; padding:19px 16px; }
    main{ padding:22px 16px 32px; }
  }

  /* export PDF */
  body.pdf-mode .no-print{ display:none !important; }
  body.pdf-mode .app{ box-shadow:none; }
  .pdf-busy{ position:fixed; inset:0; background:rgba(31,42,56,.35); display:flex; align-items:center; justify-content:center; z-index:50; }
  .pdf-busy div{ background:#fff; color:var(--bleu); padding:16px 22px; border-radius:12px; font-weight:800; }
  .load-error{ margin:24px 0; padding:16px 18px; border-left:4px solid var(--rouge); background:#FBEAEA; border-radius:8px; line-height:1.5; }

  /* print */
  @media print{
    body{ background:#fff; }
    .app{ box-shadow:none; max-width:none; }
    header.topbar{ background:#fff !important; border-bottom:3px solid var(--rouge); }
    header.topbar .tag{ color: var(--bleu); }
    .no-print{ display:none !important; }
    .rec-card{ break-inside: avoid; }
  }

  /* bloc indicator (enveloppe / air intérieur) */
  .block-indicator{
    display:flex;
    gap:8px;
    margin-bottom:22px;
  }
  .block-pill{
    flex:1;
    text-align:center;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:9px 6px;
    border-radius:8px;
    background:#EEF0F1;
    color:var(--text-muted);
  }
  .block-pill.active{ background: var(--bleu); color:#fff; }
  .block-pill.done{ background: var(--gris); color:#fff; }

  /* info screen (verrou QHSE) */
  .info-badge{
    display:inline-block;
    background:#FFF6E5;
    color:#8a5c04;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.05em;
    padding:6px 12px;
    border-radius:20px;
    margin-bottom:16px;
  }
  .info-title{
    font-size:26px;
    font-weight:900;
    color:var(--bleu);
    line-height:1.25;
    margin-bottom:14px;
  }
  .info-text{
    font-size:15px;
    line-height:1.6;
    color:var(--text);
    background:#FFF9EE;
    border-left:4px solid #C98A0A;
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:20px;
  }

  /* rec card variants */
  .rec-card.prereq{ border-color:#C98A0A; background:#FFFBF2; }
  .rec-tag.prereq{ background:#C98A0A; color:#fff; }
  .rec-note{
    font-size:13px;
    color:#8a5c04;
    background:#FFF6E5;
    border-radius:8px;
    padding:10px 12px;
    margin-top:10px;
    line-height:1.5;
  }
  .group-title{
    font-size:13px;
    font-weight:800;
    color:var(--rouge);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin:22px 0 12px;
  }
  .status-pill{
    display:inline-block;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:5px 12px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .status-pill.a{ background:#E4EFE6; color:#2f6a3f; }
  .status-pill.b{ background:#FFF1E0; color:#8a5c04; }
  .status-pill.c{ background:var(--ok-bg); color:var(--rouge); }
</style>
</head>

  <header class="topbar">
    <img id="logo-img" alt="ATTILA">
    <div class="tag">Diagnostic confort d'été<br>Outil chargé de clientèle</div>
  </header>

  <main id="main"></main>
</div>

/* ===================== DONNÉES =====================
   Agences, fiches solutions, libellés des questions et mesures de visite
   sont chargés depuis data.json (modifiable sans toucher au code).
   Seule la logique du logigramme (enchaînement des questions) reste ici. */

let AGENCES = [];
let SOLUTIONS = {};
let MESURES = [];

/* ===================== MOTEUR : GRAPHE DE QUESTIONS ===================== */
/* Fidèle au logigramme unique ORICAMI : D0/D1 (accueil) -> Bloc 1 Enveloppe (Q1-Q6) -> Bloc 2 Air intérieur (Q7-Q10) -> FIN A / FIN B / FIN C */

/* Les champs eyebrow, text, aide (et badge, title pour v1) viennent de data.json → questions */
const NODES = {

  q1: {
    type:"question", block:"enveloppe",
    handle:(v)=> (v==="non") ? {next:"q3"} : {next:"q2"}
  },

  q2: {
    type:"question", block:"enveloppe",
    handle:(v)=>{
      if(v==="non") return {next:"q3"};
      return {reveal:"s1_protections", uncertain:(v==="incertain"), next:"q3"};
    }
  },

  q3: {
    type:"question", block:"enveloppe",
    handle:(v)=> (v==="non") ? {next:"q6"} : {next:"q4"}
  },

  q4: {
    type:"question", block:"enveloppe",
    handle:(v)=>{
      if(v==="oui") return {next:"q5"};
      // non ou incertain : le support n'étant pas garanti sain, la réfection/rechapage lourd est la seule voie sûre
      return {reveal:"s3_membrane", uncertain:(v==="incertain"), next:"q6"};
    }
  },

  q5: {
    type:"question", block:"enveloppe",
    handle:(v)=>{
      if(v==="non") return {reveal:"s4_coolroof", uncertain:false, next:"q6"};
      return {reveal:"s3_membrane", uncertain:(v==="incertain"), next:"q6"};
    }
  },

  q6: {
    type:"question", block:"enveloppe",
    handle:(v)=> (v==="non") ? {next:"finalA"} : {next:"q7"}
  },

  q7: {
    type:"question", block:"air",
    handle:(v)=> (v==="non") ? {next:"q8"} : {next:"v1"}
  },

  v1: {
    type:"info",
    next:"q7b"
  },

  q7b: {
    type:"question", block:"air",
    handle:(v)=> (v==="oui") ? {next:"q8"} : {next:"finalB"}
  },

  q8: {
    type:"question", block:"air",
    handle:(v)=>{
      if(v==="non") return {next:"q10"};
      return {reveal:"s5_ventilation", uncertain:(v==="incertain"), next:"q9"};
    }
  },

  q9: {
    type:"question", block:"air",
    handle:(v)=>{
      if(v==="non") return {next:"q10"};
      return {reveal:"s6_freecooling", uncertain:(v==="incertain"), next:"q10"};
    }
  },

  q10: {
    type:"question", block:"air",
    handle:(v)=>{
      if(v==="non") return {next:"finalC"};
      return {reveal:"s7_adiabatique", uncertain:(v==="incertain"), next:"finalC"};
    }
  },

  finalA: { type:"final", variant:"A" },
  finalB: { type:"final", variant:"B" },
  finalC: { type:"final", variant:"C" }
};

/* ===================== ÉTAT DE L'APPLICATION ===================== */

function freshState(){
  return {
    screen: "start",
    client: "", agence: "", date: "",
    currentId: "q1",
    answers: {},
    triggered: [],        // [{key, uncertain, fromId}]
    uncertainNotes: [],   // [{id, label}] pour les questions sans reveal direct répondues "incertain"
    pendingReveal: null,  // {key, uncertain, nextId}
    pendingInfo: null,    // {nextId}
    finalVariant: null,
    history: []           // pile des ids de question répondues, pour "Précédent"
  };
}

let state = freshState();

function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
}

/* ===================== RENDU ===================== */

const main = document.getElementById('main');

function render(){
  if(state.screen === "start")  return renderStart();
  if(state.screen === "question") return renderQuestion();
  if(state.screen === "info")   return renderInfo();
  if(state.screen === "reveal") return renderReveal();
  if(state.screen === "final")  return renderFinal();
}

function renderStart(){
  main.innerHTML = `
    <div class="start-title">Diagnostic confort d'été</div>
    <div class="start-sub">Répondez aux questions du client une par une (Oui / Non). L'outil suit le logigramme unique ORICAMI : l'enveloppe du bâtiment d'abord, l'air intérieur ensuite si besoin, puis génère une synthèse à remettre ou à imprimer.</div>

    <div class="field">
      <label>Agence ORICAMI</label>
      <select id="in-agence">
        <option value="">— Sélectionner —</option>
        ${AGENCES.map(a => `<option value="${a}">${a}</option>`).join("")}
      </select>
    </div>
    <div class="field">
      <label>Nom du client / du site</label>
      <input id="in-client" type="text" placeholder="Ex : Menuiserie Dupont — Bourg-en-Bresse">
    </div>
    <div class="field">
      <label>Date de l'entretien</label>
      <input id="in-date" type="text" value="${todayStr()}">
    </div>

    <div class="note-box">
      <strong>Avant de démarrer, réunissez si possible :</strong> la zone d'activité, les horaires d'occupation, l'activité du site, l'état de la toiture, la présence de verrières/lanterneaux, la ventilation existante et les contraintes process éventuelles.
    </div>
    <div class="note-box">
      Cet outil est une pré-qualification commerciale de premier niveau. Il ne remplace pas un diagnostic technique de terrain (relevé de toiture, mesures, calcul de charge thermique) qui reste nécessaire avant toute offre chiffrée.
    </div>

    <button class="btn-primary" style="width:100%;padding:18px;font-size:17px;" onclick="startDiag()">Démarrer le diagnostic</button>
  `;
}

function startDiag(){
  state.client = document.getElementById('in-client').value.trim();
  state.agence = document.getElementById('in-agence').value;
  state.date = document.getElementById('in-date').value;
  state.screen = "question";
  state.currentId = "q1";
  state.history = [];
  render();
}

function blockOf(nodeId){
  const node = NODES[nodeId];
  if(node.block) return node.block;
  if(node.type === "info") return "air";
  if(node.type === "final") return (node.variant === "A") ? "enveloppe" : "air";
  return "enveloppe";
}

function renderBlockIndicator(nodeId){
  const current = blockOf(nodeId);
  const enveloppeDone = (current === "air"); // si on est dans le bloc air, le bloc enveloppe est terminé
  return `
    <div class="block-indicator">
      <div class="block-pill ${current==='enveloppe' ? 'active' : (enveloppeDone ? 'done' : '')}">1 · Enveloppe du bâtiment</div>
      <div class="block-pill ${current==='air' ? 'active' : ''}">2 · Air intérieur</div>
    </div>
  `;
}

function currentNode(){ return NODES[state.currentId]; }

function renderQuestion(){
  const node = currentNode();
  main.innerHTML = `
    <div class="nav-row no-print">
      <button class="link-btn" onclick="goBack()" ${state.history.length===0 ? "style='visibility:hidden'" : ""}>&larr; Précédent</button>
      <button class="link-btn" onclick="restart()">Recommencer</button>
    </div>
    ${renderBlockIndicator(state.currentId)}
    <div class="q-eyebrow">${node.eyebrow}</div>
    <div class="q-text">${node.text}</div>
    <div class="q-aide">${node.aide}</div>
    <div class="btn-stack">
      <button class="btn-big btn-oui" onclick="answer('oui')">OUI</button>
      <button class="btn-big btn-non" onclick="answer('non')">NON</button>
      <button class="btn-incertain" onclick="answer('incertain')">Je ne sais pas / à vérifier en visite</button>
    </div>
  `;
}

function shortLabel(text){
  return text.length > 70 ? text.slice(0,70) + "…" : text;
}

function goToNode(nodeId){
  const node = NODES[nodeId];
  if(node.type === "final"){
    state.currentId = nodeId;
    state.finalVariant = node.variant;
    state.screen = "final";
  } else if(node.type === "info"){
    state.currentId = nodeId;
    state.pendingInfo = { nextId: node.next };
    state.screen = "info";
  } else {
    state.currentId = nodeId;
    state.screen = "question";
  }
}

function answer(value){
  const id = state.currentId;
  const node = NODES[id];

  state.history.push(id);
  state.answers[id] = value;

  // Nettoyage en cas de nouvelle réponse après un retour arrière
  state.triggered = state.triggered.filter(t => t.fromId !== id);
  state.uncertainNotes = state.uncertainNotes.filter(n => n.id !== id);

  const result = node.handle(value);

  if(result.reveal){
    state.triggered.push({ key: result.reveal, uncertain: !!result.uncertain, fromId: id });
    state.pendingReveal = { key: result.reveal, uncertain: !!result.uncertain, nextId: result.next };
    state.screen = "reveal";
  } else {
    if(value === "incertain"){
      state.uncertainNotes.push({ id: id, label: shortLabel(node.text) });
    }
    goToNode(result.next);
  }
  render();
}

function goBack(){
  if(state.history.length === 0) return;
  const prev = state.history.pop();
  delete state.answers[prev];
  state.triggered = state.triggered.filter(t => t.fromId !== prev);
  state.uncertainNotes = state.uncertainNotes.filter(n => n.id !== prev);
  state.pendingReveal = null;
  state.pendingInfo = null;
  state.currentId = prev;
  state.screen = "question";
  render();
}

function restart(){
  state = freshState();
  render();
}

function renderReveal(){
  const r = state.pendingReveal;
  const sol = SOLUTIONS[r.key];
  const isPrereq = (sol.tag === "prereq");

  main.innerHTML = `
    <div class="nav-row no-print"><span></span><button class="link-btn" onclick="restart()">Recommencer</button></div>
    <div class="reveal-badge" ${isPrereq ? 'style="background:#FFF1E0;color:#8a5c04;"' : ''}>${isPrereq ? "Prérequis identifié" : "Solution identifiée"}</div>
    <div class="reveal-title">${sol.title}</div>
    <div class="reveal-fiche">${sol.fiche}</div>

    ${r.uncertain ? `<div class="unsure-box">⚠ Réponse marquée « à vérifier » : cette recommandation est provisoire, à confirmer par le technicien lors de la visite avant chiffrage.</div>` : ""}

    <div class="reveal-section">
      <h4>Pourquoi cette solution</h4>
      <p>${sol.text}</p>
    </div>
    <div class="reveal-section">
      <h4>Points de vigilance à vérifier en visite</h4>
      <ul>${sol.vigilance.map(v => `<li>${v}</li>`).join("")}</ul>
    </div>
    ${sol.note ? `<div class="rec-note">${sol.note}</div>` : ""}

    <button class="btn-continue" onclick="continueAfterReveal()">Continuer le diagnostic &rarr;</button>
  `;
}

function continueAfterReveal(){
  const nextId = state.pendingReveal.nextId;
  state.pendingReveal = null;
  goToNode(nextId);
  render();
}

function renderInfo(){
  const node = currentNode();
  main.innerHTML = `
    <div class="nav-row no-print">
      <button class="link-btn" onclick="goBack()">&larr; Précédent</button>
      <button class="link-btn" onclick="restart()">Recommencer</button>
    </div>
    ${renderBlockIndicator(state.currentId)}
    <div class="info-badge">${node.badge}</div>
    <div class="info-title">${node.title}</div>
    <div class="info-text">${node.text}</div>
    <button class="btn-continue" onclick="continueAfterInfo()">Continuer le diagnostic &rarr;</button>
  `;
}

function continueAfterInfo(){
  const nextId = state.pendingInfo.nextId;
  state.pendingInfo = null;
  goToNode(nextId);
  render();
}

function computeEcartees(){
  const ec = [];
  if(state.answers.q2 === "non"){
    ec.push({ key:"s1_protections", reason:"pas de surchauffe marquée signalée sous verrières, lanterneaux ou sheds." });
  }
  if(state.answers.q4 === "oui" && state.answers.q5 !== undefined){
    if(state.answers.q5 === "non"){
      ec.push({ key:"s3_membrane", reason:"pas de réfection lourde prévue : résine Coolroof retenue à la place." });
    } else {
      ec.push({ key:"s4_coolroof", reason:"réfection lourde déjà prévue : membrane blanche retenue à la place." });
    }
  }
  if(state.answers.q4 === "non" || state.answers.q4 === "incertain"){
    ec.push({ key:"s4_coolroof", reason:"support non confirmé sain : une réfection/rechapage lourd (membrane blanche) est nécessaire, la résine coolroof n'est pas envisageable en l'état." });
  }
  if(state.answers.q8 === "non"){
    ec.push({ key:"s5_ventilation", reason:"pas de blocage d'air chaud sous toiture avec ouvrants possibles signalé." });
    ec.push({ key:"s6_freecooling", reason:"pas d'ouvrants hauts et bas envisageables pour une ventilation nocturne." });
  }
  if(state.answers.q9 === "non"){
    ec.push({ key:"s6_freecooling", reason:"pas d'écart jour/nuit exploitable avec automatisation possible signalé." });
  }
  if(state.answers.q10 === "non"){
    ec.push({ key:"s7_adiabatique", reason:"besoin actif fort ou conditions eau/entretien/hygrométrie non réunies." });
  }
  return ec;
}

function recCardHtml(key, uncertain){
  const sol = SOLUTIONS[key];
  const isPrereq = (sol.tag === "prereq");
  return `
    <div class="rec-card ${isPrereq ? "prereq" : "priority"}">
      <span class="rec-tag ${isPrereq ? "prereq" : "priority"}">${isPrereq ? "Prérequis" : "Solution retenue"}</span>
      <h3>${sol.title}${uncertain ? " (à confirmer visite)" : ""}</h3>
      <p>${sol.text}</p>
      <div class="fiche">${sol.fiche}</div>
      ${sol.note ? `<div class="rec-note">${sol.note}</div>` : ""}
    </div>
  `;
}

function renderFinal(){
  const variant = state.finalVariant;
  const envelopeKeys = ["s1_protections","s3_membrane","s4_coolroof"];
  const airKeys = ["s5_ventilation","s6_freecooling","s7_adiabatique"];

  const triggeredEnvelope = state.triggered.filter(t => envelopeKeys.includes(t.key));
  const triggeredAir = state.triggered.filter(t => airKeys.includes(t.key));
  const ecartees = computeEcartees();

  let statusHtml, titleText;
  if(variant === "A"){
    statusHtml = `<span class="status-pill a">Enveloppe seule — besoin résiduel non exprimé</span>`;
    titleText = "Préconisation enveloppe seule";
  } else if(variant === "B"){
    statusHtml = `<span class="status-pill b">Validation QHSE requise — étude complémentaire obligatoire</span>`;
    titleText = "Enveloppe seule à ce stade";
  } else {
    statusHtml = `<span class="status-pill c">Diagnostic complet — combinaison validée</span>`;
    titleText = "Synthèse de diagnostic";
  }

  const envelopeSectionHtml = triggeredEnvelope.length ? `
    <div class="group-title">1 · Solutions enveloppe du bâtiment (étude prioritaire)</div>
    ${triggeredEnvelope.map(t => recCardHtml(t.key, t.uncertain)).join("")}
  ` : `
    <div class="group-title">1 · Solutions enveloppe du bâtiment (étude prioritaire)</div>
    <div class="ecarte-item">Aucune solution enveloppe nécessaire à ce stade au vu des réponses données.</div>
  `;

  const airSectionHtml = (variant === "C") ? (triggeredAir.length ? `
    <div class="group-title">2 · Solutions air intérieur (étude complémentaire)</div>
    ${triggeredAir.map(t => recCardHtml(t.key, t.uncertain)).join("")}
  ` : `
    <div class="group-title">2 · Solutions air intérieur (étude complémentaire)</div>
    <div class="ecarte-item">Aucune solution air intérieur nécessaire à ce stade au vu des réponses données.</div>
  `) : "";

  const v1ReminderHtml = (variant === "B") ? `
    <div class="warn-box">⚠ ${NODES.v1.text}</div>
  ` : "";

  const ecarteesHtml = ecartees.length ? `
    <div class="section-title">Solutions écartées à ce stade</div>
    ${ecartees.map(e => `<div class="ecarte-item">${SOLUTIONS[e.key].title} — non retenue (${e.reason})</div>`).join("")}
  ` : "";

  const uncertainHtml = state.uncertainNotes.length ? `
    <div class="section-title">Points à vérifier en visite (réponses incertaines)</div>
    ${state.uncertainNotes.map(n => `<div class="ecarte-item">${n.label}</div>`).join("")}
  ` : "";

  main.innerHTML = `
    <div class="final-header">
      <div class="ftitle">${titleText} — ${state.client || "Client non renseigné"}</div>
      <div class="fmeta">Agence ORICAMI ${state.agence || "—"} · ${state.date || todayStr()}</div>
    </div>

    ${statusHtml}

    ${v1ReminderHtml}

    ${envelopeSectionHtml}
    ${airSectionHtml}
    ${ecarteesHtml}
    ${uncertainHtml}

    <div class="section-title">Mesures à réaliser lors de la visite technique</div>
    <ul class="mesure-list">
      ${MESURES.map(m => `<li><span class="chk"></span><span>${m}</span></li>`).join("")}
    </ul>

    <div class="footer-note">
      Cette orientation est une pré-qualification commerciale de premier niveau, issue des réponses données par le client. Elle doit être confirmée par un diagnostic technique de terrain avant la remise d'une offre chiffrée. Les solutions sont combinables, mais les gains ne s'additionnent pas mécaniquement : le chargé de clientèle vend un diagnostic, pas une promesse de température.
    </div>

    <div class="final-actions no-print">
      <button class="btn-secondary" onclick="restart()">Nouveau diagnostic</button>
      <button class="btn-primary" onclick="exportPDF()">Exporter en PDF</button>
    </div>
  `;
}

/* ===================== EXPORT PDF ===================== */
const PDF_LIBS = [
  "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
];
let pdfLibsPromise = null;
function loadScript(src){
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src; el.onload = resolve; el.onerror = reject;
    document.head.appendChild(el);
  });
}
function loadPdfLibs(){
  if(window.html2canvas && window.jspdf) return Promise.resolve();
  if(!pdfLibsPromise) pdfLibsPromise = Promise.all(PDF_LIBS.map(loadScript)).catch(e => { pdfLibsPromise = null; throw e; });
  return pdfLibsPromise;
}
/* Cherche une ligne de pixels sans texte pour ne pas couper une ligne entre deux pages */
function findBreak(ctx, width, start, limit){
  const minY = start + Math.floor((limit - start) * 0.7);
  const data = ctx.getImageData(0, minY, width, limit - minY).data;
  for(let y = limit - minY - 1; y >= 0; y--){
    const row = y * width * 4, mid = row + Math.floor(width / 2) * 4;
    let diff = 0;
    for(let x = 0; x < width; x += 2){
      const i = row + x * 4;
      if(Math.abs(data[i]-data[mid]) + Math.abs(data[i+1]-data[mid+1]) + Math.abs(data[i+2]-data[mid+2]) > 60) diff++;
    }
    if(diff < width * 0.01) return minY + y;
  }
  return limit;
}
function safeFilename(str){
  return String(str || "client").normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9-_ ]/g, "").trim().replace(/\s+/g, "-").slice(0, 60) || "client";
}
function exportPDF(){
  const busy = document.createElement("div");
  busy.className = "pdf-busy"; busy.innerHTML = "<div>Préparation du PDF…</div>";
  document.body.appendChild(busy);
  const cleanup = () => { document.body.classList.remove("pdf-mode"); busy.remove(); };
  const width = 720, scale = 2;
  let breaks = [];   // débuts de blocs (cartes, titres, lignes) en pixels du canvas
  loadPdfLibs().then(() => {
    document.body.classList.add("pdf-mode");
    return window.html2canvas(document.getElementById("app"), {
      scale: scale, useCORS: true, backgroundColor: "#FFFFFF",
      windowWidth: width, width: width, scrollX: 0, scrollY: 0,
      onclone: (doc) => {
        const app = doc.getElementById("app");
        app.style.width = width + "px";
        const top = app.getBoundingClientRect().top;
        breaks = Array.from(doc.querySelectorAll("#main > *, .rec-card, .mesure-list li, .ecarte-item"))
          .map(el => Math.round((el.getBoundingClientRect().top - top - 6) * scale))
          .filter(v => v > 0).sort((a, b) => a - b);
      }
    });
  }).then(canvas => {
    const pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
    const margin = 10, footer = 6;
    const imgW = pageW - margin * 2;
    const pxPerMm = canvas.width / imgW;
    const pagePx = Math.floor((pageH - margin * 2 - footer) * pxPerMm);
    const ctx = canvas.getContext("2d");
    const slices = [];
    let y = 0;
    while(y < canvas.height){
      let end = Math.min(y + pagePx, canvas.height);
      if(end < canvas.height){
        const minEnd = y + pagePx * 0.35;
        const candidates = breaks.filter(b => b > minEnd && b <= end);
        end = candidates.length ? candidates[candidates.length - 1] : findBreak(ctx, canvas.width, y, end);
      }
      if(canvas.height - end < 30 * scale) end = canvas.height; // pas de page quasi vide en fin de document
      slices.push([y, end]); y = end;
    }
    slices.forEach((sl, i) => {
      if(i > 0) pdf.addPage();
      const h = sl[1] - sl[0];
      const part = document.createElement("canvas");
      part.width = canvas.width; part.height = h;
      const pctx = part.getContext("2d");
      pctx.fillStyle = "#FFFFFF"; pctx.fillRect(0, 0, part.width, h);
      pctx.drawImage(canvas, 0, sl[0], canvas.width, h, 0, 0, canvas.width, h);
      pdf.addImage(part.toDataURL("image/jpeg", 0.92), "JPEG", margin, margin, imgW, h / pxPerMm);
      pdf.setFontSize(8); pdf.setTextColor(102, 112, 121);
      pdf.text("ORICAMI · Diagnostic confort d'été · " + (state.date || todayStr()), margin, pageH - margin + 2);
      pdf.text("Page " + (i + 1) + " / " + slices.length, pageW - margin, pageH - margin + 2, { align: "right" });
    });
    cleanup();
    pdf.save("diagnostic-confort-ete-" + safeFilename(state.client) + ".pdf");
  }).catch(() => {
    cleanup();
    window.print(); // hors connexion : impression navigateur (« Enregistrer en PDF »)
  });
}

/* ===================== INIT ===================== */
function applyData(data){
  if(!data || !Array.isArray(data.agences) || !data.solutions || !data.questions || !Array.isArray(data.mesures))
    throw new Error("data.json incomplet");
  AGENCES = data.agences;
  SOLUTIONS = data.solutions;
  MESURES = data.mesures;
  Object.keys(NODES).forEach(id => {
    if(NODES[id].type === "final") return;
    if(!data.questions[id]) throw new Error("question " + id + " absente de data.json");
    Object.assign(NODES[id], data.questions[id]);
  });
}
fetch("data.json", { cache: "no-cache" })
  .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(data => { applyData(data); render(); })
  .catch(err => {
    main.innerHTML = `<div class="load-error"><strong>Impossible de charger le contenu du diagnostic (data.json).</strong><br>
      Ouvrez l'outil depuis son lien en ligne (GitHub Pages), et vérifiez que data.json est présent à côté d'index.html.<br>
      <small>Détail : ${String(err && err.message || err)}</small></div>`;
  });
</script>
